<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,viewport-fit=cover" />
<title>Video</title>
<link rel="stylesheet" href="styles.css" />
<script src='//libtl.com/sdk.js' data-zone='11887264' data-sdk='show_11887264'></script>
<script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>
<body>
<header class="topbar">
  <div class="brand">🎬 Video</div>
  <div class="user" id="userInfo"></div>
</header>

<main id="app">
  <section id="view-detail" class="view">
    <div class="card">
      <img id="detailThumb" class="thumb" alt="" />
      <h2 id="detailTitle">Loading…</h2>
      <p id="detailDesc" class="muted"></p>
      <ul class="meta">
        <li>⏱ <span id="detailDuration"></span></li>
        <li>📦 <span id="detailSize"></span></li>
        <li>👁 <span id="detailViews"></span> views</li>
        <li>📥 <span id="detailDownloads"></span> downloads</li>
      </ul>
      <div class="actions">
        <button class="btn primary" id="watchBtn" disabled>▶️ WATCH / STREAM</button>
      </div>
      <p class="note">
        The bot will send you the video. You can stream or download it inside Telegram.
      </p>
    </div>
  </section>
</main>

<footer class="foot">
  Powered by Telegram • Mini App hosted on GitHub Pages
</footer>

<script src="config.js"></script>
<script src="app.js"></script>
</body>
</html>
